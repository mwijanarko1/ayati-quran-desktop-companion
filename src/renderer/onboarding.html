<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../../assets/icon.png" />
    <title>Ayati - Quran Desktop Companion Setup</title>

    <!-- Preconnect so font downloads start immediately in parallel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Font stylesheet via <link> (non-blocking; avoids @import waterfall) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Amiri+Quran&display=swap"
    />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body {
        font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
        background-color: #FAF9F6;
        color: #1a2a24;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite processes this through PostCSS + Tailwind at build time -->
    <!-- NO CDN scripts — icons are bundled via @iconify/react -->
    <script type="module" src="./onboarding/main.tsx"></script>
  </body>
</html>
